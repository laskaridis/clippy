services:
  dev-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace
    command: sleep infinity
    environment:
      - DJANGO_DEV_PORT
      - ALLOWED_HOSTS
      - POSTGRES_HOST
      - POSTGRES_PORT
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - DATABASE_URL
    ports:
      - "${DJANGO_DEV_PORT}:${DJANGO_DEV_PORT}"
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
