name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - "**"

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run backend test suite
        run: python manage.py test
        working-directory: backend

  extension-unit-tests:
    name: Extension unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile
        working-directory: extension

      - name: Run extension unit test suite
        run: pnpm test
        working-directory: extension

  extension-e2e-tests:
    name: Extension e2e tests
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - extension-unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile
        working-directory: extension

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('extension/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium
        working-directory: extension

      - name: Install Playwright Chromium (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
        working-directory: extension

      - name: Run extension e2e suite
        run: pnpm run test:e2e
        working-directory: extension
