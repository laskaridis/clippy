name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - "**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Run backend lint
        run: python -m ruff check .
        working-directory: backend

      - name: Run backend format check
        run: python -m black --check .
        working-directory: backend

      - name: Run backend typecheck
        run: python -m mypy .
        working-directory: backend

  extension-quality:
    name: Extension quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile
        working-directory: extension

      - name: Run extension lint
        run: pnpm run lint
        working-directory: extension

      - name: Run extension format check
        run: pnpm run format:check
        working-directory: extension

      - name: Run extension typecheck
        run: pnpm run typecheck
        working-directory: extension

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    needs:
      - backend-quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: webclippings_ci
          POSTGRES_USER: webclippings
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webclippings -d webclippings_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://webclippings:password@127.0.0.1:5432/webclippings_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Wait for PostgreSQL
        run: |
          python - <<'PY'
          import socket
          import time

          deadline = time.time() + 30
          while time.time() < deadline:
            try:
              with socket.create_connection(("127.0.0.1", 5432), timeout=1):
                raise SystemExit(0)
            except OSError:
              time.sleep(1)
          raise SystemExit("PostgreSQL did not become ready in time")
          PY

      - name: Run backend test suite
        run: python manage.py test --exclude-tag=e2e
        working-directory: backend

  backend-e2e-tests:
    name: Backend e2e tests
    runs-on: ubuntu-latest
    needs:
      - backend-tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: webclippings_ci
          POSTGRES_USER: webclippings
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webclippings -d webclippings_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://webclippings:password@127.0.0.1:5432/webclippings_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Install backend Playwright Chromium
        run: python -m playwright install chromium
        working-directory: backend

      - name: Wait for PostgreSQL
        run: |
          python - <<'PY'
          import socket
          import time

          deadline = time.time() + 30
          while time.time() < deadline:
            try:
              with socket.create_connection(("127.0.0.1", 5432), timeout=1):
                raise SystemExit(0)
            except OSError:
              time.sleep(1)
          raise SystemExit("PostgreSQL did not become ready in time")
          PY

      - name: Run backend e2e test suite
        run: python manage.py test --tag=e2e
        working-directory: backend

  extension-unit-tests:
    name: Extension unit tests
    runs-on: ubuntu-latest
    needs:
      - extension-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile
        working-directory: extension

      - name: Run extension unit test suite
        run: pnpm test
        working-directory: extension

  extension-e2e-tests:
    name: Extension e2e tests
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - backend-e2e-tests
      - extension-unit-tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: webclippings_ci
          POSTGRES_USER: webclippings
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webclippings -d webclippings_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://webclippings:password@127.0.0.1:5432/webclippings_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile
        working-directory: extension

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('extension/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium
        working-directory: extension

      - name: Install Playwright Chromium (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
        working-directory: extension

      - name: Run extension e2e suite
        run: pnpm run test:e2e
        working-directory: extension
