name: "${SANDBOX_ID:-sandbox}"

services:
  dev-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - workspace:/workspace
    user: root
    entrypoint: ["/usr/local/bin/init"]
    command: ["sleep", "infinity"]
    environment:
      DJANGO_DEV_PORT: "${DJANGO_DEV_PORT:-8794}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}"
      POSTGRES_HOST: "${POSTGRES_HOST:-postgres}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_DB: "${POSTGRES_DB:-webclippings}"
      POSTGRES_USER: "${POSTGRES_USER:-webclippings}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      DATABASE_URL: "${DATABASE_URL:-postgres://webclippings:password@postgres:5432/webclippings}"
      SANDBOX_REPO_URL: "${SANDBOX_REPO_URL:-}"
      GIT_AUTH_TOKEN: "${GIT_AUTH_TOKEN:-}"
      SANDBOX_ID: "${SANDBOX_ID:-}"
    ports:
      - "${DJANGO_DEV_PORT:-8794}:${DJANGO_DEV_PORT:-8794}"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-webclippings}"
      POSTGRES_USER: "${POSTGRES_USER:-webclippings}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password}"

volumes:
  workspace:
