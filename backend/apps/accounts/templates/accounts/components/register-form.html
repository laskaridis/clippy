<form method="post" novalidate data-component="register-form">
  {% csrf_token %}

  <div class="mb-3">
    <label for="id_username" class="form-label">Email</label>
    <input type="email" name="username" id="id_username" class="form-control" required>
    {% if form.username.errors %}
      <div class="text-danger small">{{ form.username.errors|striptags }}</div>
    {% endif %}
  </div>

  <div class="mb-3">
    <label for="id_password1" class="form-label">Password</label>
    <input type="password" name="password1" id="id_password1" class="form-control" required>
    {% if form.password1.errors %}
      <div class="text-danger small">{{ form.password1.errors|striptags }}</div>
    {% endif %}
  </div>

  <div class="mb-3">
    <label for="id_password2" class="form-label">Confirm password</label>
    <input type="password" name="password2" id="id_password2" class="form-control" required>
    {% if form.password2.errors %}
      <div class="text-danger small">{{ form.password2.errors|striptags }}</div>
    {% endif %}
  </div>

  <button type="submit" class="btn btn-primary w-100 mb-2">Create account</button>
  <p class="text-center small text-secondary mb-0">
    Already have an account?
    <a href="{% url 'accounts:login' %}">Sign in</a>
  </p>
</form>
