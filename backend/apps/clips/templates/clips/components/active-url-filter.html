<section class="mb-4" aria-label="Active URL filter" data-component="active-url-filter">
  <div class="d-flex flex-wrap align-items-center gap-2">
    <span class="small text-secondary">Active URL filter:</span>
    <span class="badge text-bg-primary">{{ active_url_filter }}</span>
    {% if not selected_labels %}
      <a
        class="btn btn-outline-secondary btn-sm"
        href="{% url 'clips_web:list' %}{{ clear_all_filters_query }}"
        data-action="clear-label-filters"
      >
        Clear all
      </a>
    {% endif %}
  </div>
</section>
