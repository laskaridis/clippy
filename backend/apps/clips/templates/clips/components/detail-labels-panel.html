<section class="card p-4 mb-3" data-component="detail-labels-panel">
  <h2 class="h6 mb-3">Labels</h2>

  {% with labels=clip.labels.all %}
    {% if labels %}
      <div class="mb-3">
        {% for label in labels %}
          <span class="badge text-bg-primary me-1 mb-1">{{ label.name }}</span>
        {% endfor %}
      </div>
    {% else %}
      <p class="text-secondary mb-3 small">No labels yet.</p>
    {% endif %}
  {% endwith %}

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label for="id_labels" class="form-label">Edit labels</label>
      <input
        type="text"
        id="id_labels"
        name="labels"
        value="{{ labels_text }}"
        class="form-control form-control-sm"
        placeholder="research, inspiration, reading-list"
      >
      <div class="form-text">Comma-separated list, e.g. <code>research, css, inspiration</code>.</div>
    </div>
    <button type="submit" class="btn btn-primary btn-sm">Save labels</button>
  </form>
</section>
