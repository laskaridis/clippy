<div class="card p-4 text-center" data-component="list-empty-state">
  {% if selected_labels %}
    <h2 class="h5 mb-2">No clips match the selected labels</h2>
    <p class="text-secondary mb-3">Try removing one or more labels to broaden your results.</p>
    <p class="mb-0">
      <a
        class="btn btn-outline-secondary btn-sm"
        href="{% url 'clips_web:list' %}{{ clear_all_filters_query }}"
        data-action="clear-label-filters"
      >
        Clear all
      </a>
    </p>
  {% else %}
    <h2 class="h5 mb-2">No clips yet</h2>
    <p class="text-secondary mb-3">Use the Clippy browser extension to start capturing the web.</p>
    <p class="mb-0 small text-secondary">Once you save your first clip, it will appear here automatically.</p>
  {% endif %}
</div>
