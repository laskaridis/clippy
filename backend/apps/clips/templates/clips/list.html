{% extends "base.html" %}

{% block title %}My clips{% endblock %}

{% block content %}
  <h1>My clips</h1>

  {% if clips %}
    <ul>
      {% for clip in clips %}
        <li>
          <a href="{% url 'clips_web:detail' clip.id %}">
            {{ clip.title|default:clip.url }}
          </a>
          <span>{{ clip.created_at }}</span>
          <span>{{ clip.domain }}</span>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No clips yet.</p>
  {% endif %}
{% endblock %}
