[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = '''
(
  /migrations/
)
'''

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
  ".venv",
  "venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741", "F841"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = "(^|/)(migrations|dist|build|\\.venv|venv)/"
