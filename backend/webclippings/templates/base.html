<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{% block title %}WebClippings{% endblock %}</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="{% url 'clips_web:list' %}">My clips</a>
        {% if user.is_authenticated %}
          <span>Signed in as {{ user.email|default:user.username }}</span>
          <a href="{% url 'accounts:logout' %}">Sign out</a>
        {% else %}
          <a href="{% url 'accounts:login' %}">Sign in</a>
        {% endif %}
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
