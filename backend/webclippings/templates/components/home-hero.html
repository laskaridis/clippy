<div class="row" data-component="home-hero">
  <section class="p-5 rounded-4 bg-brand-gradient mb-4">
    <h1 class="display-5 fw-bold mb-3">Clip anything. Instantly.</h1>
    <p class="lead mb-4 opacity-75">
      Save the best parts of the web in a couple of clicks. Organise
      articles, research and inspiration so you never lose them again.
    </p>
    <div class="d-flex flex-wrap gap-3">
      {% if user.is_authenticated %}
        <a href="{% url 'clips_web:list' %}" class="btn btn-light btn-lg">Go to my clips</a>
      {% else %}
        <a href="{% url 'accounts:login' %}" class="btn btn-light btn-lg">Sign in to start clipping</a>
      {% endif %}
      <button type="button" class="btn btn-outline-light btn-lg">View docs</button>
    </div>
  </section>
</div>
