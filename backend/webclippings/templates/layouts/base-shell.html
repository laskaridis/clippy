{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Clippy{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="{% static 'js/theme-controller.js' %}"></script>

  <!-- Bootstrap 5.3 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Clippy Design System (shared with /design-system) -->
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/components/global-nav.css' %}">
  <link rel="stylesheet" href="{% static 'css/components/global-auth-quick-search.css' %}">

  {% block extra_head %}{% endblock %}
</head>

<body class="min-vh-100 d-flex flex-column">
  {% include "components/global-nav.html" with user=user only %}

  <main class="flex-grow-1">
    <div class="container py-5">
      {% block content %}{% endblock %}
    </div>
  </main>

  {% include "components/global-footer.html" with now=now only %}

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="{% static 'js/application.js' %}"></script>

  {% block extra_js %}{% endblock %}
</body>
</html>
