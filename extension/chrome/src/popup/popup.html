<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WebClippings</title>
    <style>
      body {
        margin: 0;
        padding: 8px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        background: #ffffff;
        color: #111827;
        min-width: 260px;
        max-width: 320px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 600;
      }

      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 10px;
        border-radius: 4px;
        border: 1px solid #2563eb;
        background-color: #2563eb;
        color: #ffffff;
        font-size: 12px;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      #status {
        margin-top: 8px;
        font-size: 12px;
      }

      #status.success {
        color: #15803d;
      }

      #status.error {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <h1>WebClippings</h1>
    <div id="save-controls" style="display:none;">
      <label for="labels-input" style="display:block; margin: 6px 0 4px; font-size:12px;">
        Labels (optional, comma-separated)
      </label>
      <input
        type="text"
        id="labels-input"
        placeholder="e.g. research, work"
        style="width:100%; box-sizing:border-box; padding:4px; margin-bottom:8px; font-size:12px;"
      />
      <button id="save-clip">Save selected text</button>
    </div>

    <div id="auth-controls" style="display:block; margin-top:8px;">
      <button id="open-login">Log in</button>
    </div>

    <div id="status" aria-live="polite"></div>
    <script src="../../dist/shared/messages.js"></script>
    <script src="../../dist/shared/errors.js"></script>
    <script src="../../dist/shared/config.js"></script>
    <script src="../../dist/popup/popup.js"></script>
  </body>
</html>
