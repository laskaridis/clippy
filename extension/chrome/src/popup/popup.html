<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WebClippings</title>
    <style>
      body {
        margin: 0;
        padding: 8px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        background: #ffffff;
        color: #111827;
        min-width: 260px;
        max-width: 320px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 600;
      }

      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 10px;
        border-radius: 4px;
        border: 1px solid #2563eb;
        background-color: #2563eb;
        color: #ffffff;
        font-size: 12px;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      #status {
        margin-top: 8px;
        font-size: 12px;
      }

      #status.success {
        color: #15803d;
      }

      #status.error {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <h1>WebClippings</h1>
    <button id="save-clip">Save selected text</button>
    <div id="status" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>
