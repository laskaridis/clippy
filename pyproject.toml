[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-ralph-harness"
version = "0.1.0"
description = "Opinionated CLI harness for the Ralph feature-delivery workflow"
readme = "ralph/README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ralph = "ralph.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ralph*"]

[tool.setuptools.package-data]
ralph = ["prompts/*.md", "README.md", "CONTEXT.md", "ralph.sh"]
