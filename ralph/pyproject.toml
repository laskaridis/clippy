[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ralph"
version = "0.1.0"
description = "Python Ralph CLI harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ralph = "ralph.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ralph*"]
exclude = ["ralph.tests*"]

