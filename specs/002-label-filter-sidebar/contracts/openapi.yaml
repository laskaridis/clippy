openapi: 3.0.3
info:
  title: WebClippings Label Filter Contract
  version: 0.1.0
  description: |
    Contract additions for label-based multi-select clip filtering with URL persistence,
    contextual label counts, and responsive filter panel state.
servers:
  - url: https://app.example.com
    description: Web UI origin (placeholder)

paths:
  /clips/:
    get:
      summary: Render clips list with label filters and panel state
      operationId: renderFilteredClipList
      description: |
        Server-rendered HTML endpoint for the clips page.
        Repeated label query parameters apply AND filtering semantics.
        Unknown label slugs are ignored gracefully.
      parameters:
        - in: query
          name: label
          description: |
            Repeated selected label slugs. Example: ?label=work&label=research.
            Matching uses AND semantics (clips must contain all selected labels).
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - in: query
          name: panel
          description: |
            Filter panel visibility state persisted in URL.
            Desktop uses expanded/collapsed; small-screen drawer uses open/closed.
          required: false
          schema:
            type: string
            enum: [expanded, collapsed, open, closed]
        - in: query
          name: url
          description: Existing exact-URL filter value (preserved behavior).
          required: false
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: Filtered clips page HTML
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Redirect to login when unauthenticated

  /api/clips/:
    get:
      summary: List current user's clips with optional label filtering
      operationId: listClipsByLabelSlugs
      description: |
        JSON list endpoint that mirrors label filtering semantics used by /clips/.
        Repeated label parameters are interpreted as slugs and combined with AND logic.
      parameters:
        - in: query
          name: label
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: Repeated selected label slugs.
        - in: query
          name: url
          required: false
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: Filtered clip list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClipSummary"
        "401":
          description: Authentication required

  /api/labels/:
    get:
      summary: List current user's labels
      operationId: listLabelsCatalog
      description: |
        Returns a full, selection-agnostic label catalog for the current user.
        The response is a flat list intended for client-side ordering/searching.
        Legacy query parameters (`label`, `limit`, `expanded`) are accepted but ignored.
      parameters:
        - in: query
          name: label
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: Legacy parameter; ignored.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 10
          description: Legacy parameter; ignored.
        - in: query
          name: expanded
          required: false
          schema:
            type: boolean
            default: false
          description: Legacy parameter; ignored.
      responses:
        "200":
          description: Full label catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LabelCatalogItem"
        "401":
          description: Authentication required

components:
  schemas:
    ClipSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
      required: [id, url, created_at, labels]

    Label:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
      required: [name, slug]

    LabelCatalogItem:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        color:
          type: string
          nullable: true
      required: [name, slug, color]
